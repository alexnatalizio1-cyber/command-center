# Daily Blancco SDR market-research email.
#
# This calls the deployed app's /api/market-research route, which pulls North
# American enterprise/mid-market accounts from Apollo, scores + enriches them,
# emails the SDR team, and appends the picks to a Google Sheet.
#
# ---------------------------------------------------------------------------
# ONE-TIME SETUP (repo Settings -> Secrets and variables -> Actions):
#
#   MARKET_RESEARCH_APP_URL     e.g. https://your-app.vercel.app  (no trailing /)
#   MARKET_RESEARCH_CRON_SECRET same value as the deployed env var;
#                               generate with: openssl rand -hex 32
#   VERCEL_AUTOMATION_BYPASS_SECRET
#                               required because Vercel Deployment Protection
#                               ("Vercel Authentication") is enabled. Create it
#                               in Vercel: Project -> Settings -> Deployment
#                               Protection -> Protection Bypass for Automation
#                               -> copy the generated secret here.
#
# The deployed app also needs (in its hosting env, NOT here):
#   APOLLO_API_KEY, GEMINI_API_KEY, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET,
#   GOOGLE_REFRESH_TOKEN, MARKET_RESEARCH_RECIPIENTS, MARKET_RESEARCH_CRON_SECRET
#
# Minting GOOGLE_REFRESH_TOKEN for the sending mailbox:
#   1. https://developers.google.com/oauthplayground  (gear icon ->
#      "Use your own OAuth credentials", paste GOOGLE_CLIENT_ID/SECRET).
#   2. Authorize scopes: gmail.send, spreadsheets, drive  (sign in AS the
#      mailbox that should send the email + own the Sheet).
#   3. Exchange authorization code -> copy the refresh token into
#      GOOGLE_REFRESH_TOKEN in the app's hosting environment.
# ---------------------------------------------------------------------------

name: Daily Market Research

on:
  schedule:
    # GitHub cron is UTC-only and has no DST awareness. 9:00 AM US Eastern is
    # 13:00 UTC during EDT and 14:00 UTC during EST, so we fire on BOTH (Mon-Fri)
    # and the gate step below lets exactly one through — whichever is actually
    # 09:00 in America/New_York that day. Result: 9 AM Eastern, weekdays only,
    # year-round, no double-send, no weekends.
    - cron: '0 13 * * 1-5'
    - cron: '0 14 * * 1-5'
    # One-shot TEST: 11:30 AM ET on 2026-05-20 (15:30 UTC during EDT). Fires
    # daily but the gate's date check restricts the test send to that one day.
    # Safe to remove after the test email arrives.
    - cron: '30 15 * * *'
  workflow_dispatch: # allow manual "Run workflow" from the Actions tab

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Gate scheduled runs to 09:00 ET weekdays (plus one-shot test window)
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run — proceeding regardless of time."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          nyc_date=$(TZ="America/New_York" date +%F)
          nyc_hour=$(TZ="America/New_York" date +%H)
          nyc_min=$(TZ="America/New_York" date +%M)
          nyc_dow=$(TZ="America/New_York" date +%u)   # 1=Mon .. 7=Sun
          mins=$((10#$nyc_hour * 60 + 10#$nyc_min))
          echo "Eastern now: $(TZ='America/New_York' date)  (date=$nyc_date hour=$nyc_hour min=$nyc_min dow=$nyc_dow mins_since_midnight=$mins)"

          # Daily 09:00 ET weekday send (hour=09, any minute, Mon-Fri).
          if [ "$nyc_hour" = "09" ] && [ "$nyc_dow" -ge 1 ] && [ "$nyc_dow" -le 5 ]; then
            echo "In the daily 09:00 ET weekday window — proceeding."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # One-shot TEST: 11:30 ET on 2026-05-20, with a 60-minute leniency
          # window (until 12:30 ET) to absorb GitHub Actions cron delays.
          if [ "$nyc_date" = "2026-05-20" ] && [ "$mins" -ge 690 ] && [ "$mins" -lt 750 ]; then
            echo "In the one-shot test window (11:30-12:30 ET, 2026-05-20) — proceeding."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Not in any active window — skipping this trigger."
          echo "proceed=false" >> "$GITHUB_OUTPUT"
      - name: Trigger market-research run
        if: steps.gate.outputs.proceed == 'true'
        run: |
          if [ -z "${{ secrets.MARKET_RESEARCH_APP_URL }}" ] || [ -z "${{ secrets.MARKET_RESEARCH_CRON_SECRET }}" ]; then
            echo "::error::MARKET_RESEARCH_APP_URL and MARKET_RESEARCH_CRON_SECRET repo secrets are required."
            exit 1
          fi
          if [ -z "${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}" ]; then
            echo "::error::VERCEL_AUTOMATION_BYPASS_SECRET repo secret is required because Vercel Deployment Protection is enabled. Create it in Vercel: Settings -> Deployment Protection -> Protection Bypass for Automation."
            exit 1
          fi
          code=$(curl -sS -w "%{http_code}" -o response.json \
            -X POST "${{ secrets.MARKET_RESEARCH_APP_URL }}/api/market-research" \
            -H "Authorization: Bearer ${{ secrets.MARKET_RESEARCH_CRON_SECRET }}" \
            -H "x-vercel-protection-bypass: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}" \
            -H "x-vercel-set-bypass-cookie: false" \
            -H "Content-Type: application/json" \
            --max-time 290 \
            -d '{}')
          echo "HTTP $code"
          cat response.json
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::Market research run failed with HTTP $code"
            exit 1
          fi
